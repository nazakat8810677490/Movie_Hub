{% extends "base.html" %}

{% block title %}
Add Movie
{% endblock %}

{% block content %}

<h1>Add Movie</h1>

<div class="form">

<form action="/add-movie" method="post" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="Enter Name" required>
    <input type="text" name="release_date" placeholder="Enter Release Date" required>
    <textarea name="description" placeholder="Enter Description" required></textarea>
    <select name="category" required>
        <option value="" disabled selected>
            Category
        </option>
        {% for c in categories %}
        <option value="{{c.name}}">
            {{c.name}}
        </option>
        {% endfor %}
    </select>
    <input type="file" name="video" accept="video/*" required>
    
    <button type="submit">Submit</button>
</form>

<a href="movies">view movie</a>

</div>

{% endblock %}
